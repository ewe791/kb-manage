services:
  postgres:
    image: postgres:15
    container_name: kb_postgres
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb_agent
    ports:
      - '5432:5432'
    volumes:
      - kb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kb -d kb_agent']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: kb_redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - kb_redisdata:/data

volumes:
  kb_pgdata:
  kb_redisdata:
